name: hand-sample

# Checkpoint 4 look-test: render the 20s HandSample on GitHub Actions.
# Fetches one plate, generates its depth layers, then renders the Remotion
# composition (parallax plate + hand writing a label + drawing an arrow).

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System libs for headless Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxkbcommon0 \
            libpango-1.0-0 libasound2t64 libgtk-3-0 2>/dev/null || \
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxkbcommon0 \
            libpango-1.0-0 libasound2

      - name: Install Python deps (CPU torch for depth)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.46.3 opencv-python-headless==4.10.0.84 numpy==2.1.3

      - name: Fetch the sample plate
        run: python tools/art_fetch.py --code CL-11A --ids plate-sea-of-ice

      - name: Generate its depth layers
        run: python tools/depth_layers.py --code CL-11A --only plate-sea-of-ice --layers 3

      - name: Install Remotion deps
        working-directory: remotion
        run: npm ci --no-audit --no-fund

      - name: Render HandSample (1080p30)
        working-directory: remotion
        run: npx remotion render src/index.ts HandSample ../out/hand-sample.mp4 --log=verbose

      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: hand-sample
          path: out/hand-sample.mp4
          retention-days: 14
