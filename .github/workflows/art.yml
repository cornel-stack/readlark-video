name: art-depth

# Checkpoint 3: fetch public-domain plates and generate 2.5D parallax depth layers
# on GitHub's free runners (not locally). Plate binaries are not in the repo, so
# this re-fetches them from the source URLs in licences.json / queries.json, then
# runs Depth Anything V2 (small, CPU) to slice each plate into 3 parallax layers.
# Uploads layers.json + sample layers + the contact sheet as an artifact.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Video code (book art is shared, e.g. CL-11A)"
        required: true
        default: "CL-11A"

jobs:
  depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.46.3 opencv-python-headless==4.10.0.84 numpy==2.1.3

      - name: Fetch public-domain plates
        run: python tools/art_fetch.py --code "${{ inputs.code }}"

      - name: Generate parallax depth layers
        run: python tools/depth_layers.py --code "${{ inputs.code }}" --layers 3

      - name: Derive book code
        id: book
        run: echo "book=$(echo '${{ inputs.code }}' | grep -oE '^[A-Z]{2}-[0-9]{2}')" >> "$GITHUB_OUTPUT"

      - name: Upload layers + contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.code }}
          path: |
            assets/art/${{ steps.book.outputs.book }}/layers.json
            assets/art/${{ steps.book.outputs.book }}/licences.json
            assets/art/${{ steps.book.outputs.book }}/contact-sheet.png
            assets/art/${{ steps.book.outputs.book }}/layers/*.L0.png
            assets/art/${{ steps.book.outputs.book }}/layers/*.L1.png
            assets/art/${{ steps.book.outputs.book }}/layers/*.L2.png
          retention-days: 14
